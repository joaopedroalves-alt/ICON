<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="indexstyle.css?v=1">
    <title>ICON - Instituto de Cognição e Neuropsicologia</title>
</head>
<body>
    <header>

        <div class="logo">

            <img
                src="./imagens./logo_ICON.jpg"
                alt="ICON - Instituto de Cognição e Neuropsicologia"
            >

        </div>


        <nav>

            <a href="#">Início</a>

            <a href="#">A ICON</a>

            <a href="#">Serviços</a>

            <a href="#">Equipe</a>

        </nav>


        <!-- Vai para a página de login -->

        <a href="login.html" class="btn-agendar">
            Agendar avaliação
        </a>

    </header>



    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->

    <main class="hero">


        <!-- IMAGEM DA CONSULTA -->

        <div class="hero-image"></div>


        <!-- TEXTO -->

        <div class="content">

            <h1>

                Excelência em

                <span>Neuropsicologia</span>

                Para todas as fases da vida.

            </h1>


            <div class="info">

                <p>• Atendimento presencial e online</p>

                <p>• Equipe especializada</p>

            </div>

        </div>



        <!-- CARDS -->

        <section class="cards">


            <!-- CARD 1 -->

            <div class="card">

                <div class="card-icon">

                    <img
                        src="./imagens./cérebro.jpg"
                        alt="Avaliação neuropsicológica"
                    >

                </div>

                <p>
                    Avaliação<br>
                    neuropsicológica
                </p>

            </div>



            <!-- CARD 2 -->

            <div class="card">

                <div class="card-icon">

                    <img
                        src="./imagens./pessoas.jpg"
                        alt="Atendimento especializado"
                    >

                </div>

                <p>
                    Atendimento<br>
                    especializado
                </p>

            </div>



            <!-- CARD 3 -->

            <div class="card">

                <div class="card-icon">

                    <img
                        src="./imagens./gráfico.jpg"
                        alt="Baseado em evidências"
                    >

                </div>

                <p>
                    Baseado em<br>
                    evidências
                </p>

            </div>



            <!-- CARD 4 -->

            <div class="card">

                <div class="card-icon">

                    <img
                        src="./imagens./papel.jpg"
                        alt="Laudos especializados"
                    >

                </div>

                <p>
                    Laudos<br>
                    especializados
                </p>

            </div>


        </section>


    </main>


</body>

</html>
