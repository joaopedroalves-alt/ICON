<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilo.css?v=1">
</head>

<body class="formulario-body">

    <div class="caixa-login">

        <h1>Faça seu login</h1>

        <div class="campo">
            <p>Email ou CPF</p>
            <input type="text" placeholder=" Digite seu Email ou CPF" id="usuario">
        </div>

        <div class="campo"  >
            <p>Senha</p>
            <input type="password" placeholder=" Digite sua senha" id="senha">
        </div>

        <div class="lembrar">
            <input type="checkbox">
            Lembrar-me
        </div>

        <a class="entrar" onclick="nome()">Entrar</a>

        <a href="redefinir-senha.html" class="caixa-login-a">Esqueci minha senha</a>
        <a href="cadastro.html" class="caixa-login-a">Criar uma conta</a>
        <div id="mensagem"></div>

    </div>

    <div class="fundologo"></div>

    <div class="direita">

        <h2 class="saudacao">Seja bem-vindo!</h2>

        <p class="ICON">ICON</p>

        <p class="instituto">
            INSTITUTO DE
            <br>
            COGNIÇÃO E NEUROPSICOLOGIA
        </p>

        <img class="logo" src="imagens/logo.png" alt="Logo do Instituto de Cognição e Neuropsicologia">

        <p class="descrição">
            Inovação e precisão no cuidado neuropsicológico.
        </p>

    </div>
    <script>
      function nome(){
        let usuario = document.getElementById("usuario").value.trim().toLowerCase();
        let senha = document.getElementById("senha").value;

        if(usuario === "cliente" && senha === "123456")
          window.location.href = "dashboardcliente.html";
        else if(usuario === "medico" && senha === "123456")
          window.location.href = "dashboardmedico.html";
        else if(usuario === "administrador" && senha === "123456")
          window.location.href = "dashboardadministrador.html";
        else
    document.getElementById("mensagem").innerHTML = "<br><br>Usuário ou senha não confere"
    }
    </script>

</body>

</html>
