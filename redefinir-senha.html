<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir a senha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilo.css?v=1">
</head>

<body class="formulario-body">

    <div class="caixa-login">

        <h1>Redefinir sua senha</h1>

        <div class="campo">
            <p>Email ou CPF</p>
            <input id="email_cpf" type="text" placeholder=" Digite seu Email ou CPF">
        </div>

        <div class="nova-senha">
            <p>Senha</p>
            <input id="nova_senha" type="password" placeholder=" Digite sua nova senha">
        </div>

        <div class="confirmar-senha">
	    <p>Confirmar senha</p>
            <input id="confirmar_senha" type="password" placeholder=" Confirme a senha">
        </div>

        <a class="finalizar" onclick="redefinirSenha()">Finalizar</a>

    </div>

    <div class="fundologo"></div>

    <div class="direita">

        <h2 class="saudacao">Seja bem-vindo!</h2>

        <p class="ICON">ICON</p>

        <p class="instituto">
            INSTITUTO DE
            <br>
            COGNIÇÃO E NEUROPSICOLOGIA
        </p>

        <img class="logo" src="imagens/logo.png" alt="Logo do Instituto de Cognição e Neuropsicologia">

        <p class="descrição">
            Inovação e precisão no cuidado neuropsicológico.
        </p>

    </div>
    <script>
        function redefinirSenha() {
            let email_cpf = document.getElementById("email_cpf").value;
            let nova_senha = document.getElementById("nova_senha").value;
            let confirmar_senha = document.getElementById("confirmar_senha").value;

            if (email_cpf === "" || nova_senha === "" || confirmar_senha === "") {
                alert("Preencha todos os campos obrigatórios");
            } else if (nova_senha.length < 8 || confirmar_senha.length < 8) {
                alert("A senha deve ter no mínimo 8 caracteres");
            }
            else if (nova_senha !== confirmar_senha) {
                alert("As senhas não coincidem");
            } else {
                window.location.href = "login.html";
            }
        }

    </script>

</body>

</html>
